<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="produtos.css">
    <title>Raiz de Dalia</title>
</head>
<body>
    <header>
  <div class="menu">
      <a href="index.html">
          <img class="logo" src="imagens/logo-st.png" alt="Logo Raiz de Dália">
      </a>
      <div class="barra-de-pesquisa">
          <i class="bi bi-search"></i>
          <input type="text" placeholder="Digite o que você procura">
      </div>
     
      <section class="l-direito">
          <a href="blog.html">
              <h3>Blog</h3>
          </a>
              <i class="bi bi-basket" id="abrirCarrinho"></i>
          <div class="user-menu">
              <i class="bi bi-person-fill" id="userIcon"></i>
              <div class="dropdown" id="dropdownMenu">
                  <a href="perfil.html">Perfil</a>
                  <a href="login.html">Login</a>
                  <a href="cadastro.html">Cadastro</a>
              </div>
          </div>
      </section>
  </div>
</header>
  <section id="carrinho">
      <div class="carrinho-topo">
          <h2>CARRINHO <span class="qtd">0</span></h2>
          <button id="fecharCarrinho">✕</button>
      </div>
      <div class="carrinho-progresso">
          <p>Adicione R$99,99 para <strong>frete grátis</strong></p>
          <div class="barra">
              <div class="barra-preenchida"></div>
          </div>
      </div>
      <!-- CARRINHO VAZIO -->
      <div class="carrinho-vazio">
          <p>Seu carrinho está vazio</p>
      <button class="btn-continuar" id="continuarComprando">
          Continuar comprando
      </button>
      </div>
  </section>
  <main>
    <div class="conteiner-produto">
        <img class="img-produto-descricao" src="imagens/p-garrafa-termica-bambu.webp" alt="imagem de uma garrafa termica de banbu">
        <h2>Garrafa termica de bambu</h2>
        <p>R$50,00</p>

        <div class="quantidade">
            <button onclick="diminuir()">-</button>
            <input type="text" id="quantidade" value="1" readonly>
            <button onclick="aumentar()">+</button>
        </div>

        <button>Comprar</button>
    </div>
  </main>
  <footer>

  </footer>

    <script src="script.js"></script>
</body>
</html>
